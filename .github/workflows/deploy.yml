name: 🚀 Auto-Deploy to Cloudflare Pages & Oracle Cloud (OCI)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build & Deploy Frontend to Cloudflare Pages
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Assets
        run: npm run build

      - name: 🌐 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tgdrive-d7y' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "🌐 Deploying to Cloudflare Pages project $CF_PROJECT..."
            npx wrangler pages deploy dist --project-name "$CF_PROJECT"
          else
            echo "ℹ️ Cloudflare credentials not configured in GitHub Secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Skipping Cloudflare deploy."
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy FileStream Server & Player to Oracle Cloud (OCI)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🎬 Deploy FileStream Server to OCI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Auto-Deploy to OCI via SSH
        env:
          TARGET_HOST: ${{ secrets.OCI_HOST }}
          TARGET_USER: ${{ secrets.OCI_USER || 'ubuntu' }}
          TARGET_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          if [ -n "$TARGET_SSH_KEY" ] && [ -n "$TARGET_HOST" ]; then
            echo "🔑 Connecting to Oracle Cloud (OCI) at $TARGET_HOST..."
            mkdir -p ~/.ssh
            printf "%s\n" "$TARGET_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

            echo "📤 Uploading updated Python scripts to /home/$TARGET_USER/tg-filestream/..."
            scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 server/*.py $TARGET_USER@$TARGET_HOST:/home/$TARGET_USER/tg-filestream/

            echo "🔄 Restarting tg-filestream.service on OCI..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 $TARGET_USER@$TARGET_HOST "sudo systemctl restart tg-filestream.service"

            sleep 2
            echo "🔍 Verifying service status..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 $TARGET_USER@$TARGET_HOST "sudo systemctl is-active --quiet tg-filestream.service && echo '🎉 tg-filestream.service is ACTIVE and running healthy on OCI!' || (echo '❌ Service failed to start' && exit 1)"
          else
            echo "ℹ️ OCI credentials not configured in GitHub Secrets (OCI_HOST, OCI_SSH_KEY). Skipping OCI deploy."
          fi
