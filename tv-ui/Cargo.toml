[package]
name = "tv-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.69"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
urlencoding = "2.1"

[dependencies.web-sys]
version = "0.3.69"
features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlVideoElement",
  "HtmlImageElement",
  "Window",
  "KeyboardEvent",
  "MouseEvent",
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Event",
  "Node",
  "Location",
  "console",
]
