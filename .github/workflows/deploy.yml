name: 🚀 Auto-Deploy to Cloudflare Pages & Oracle Cloud (OCI)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build & Deploy Frontend to Cloudflare Pages
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Assets
        run: npm run build

      - name: 🌐 Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'tgdrive-d7y' }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: ℹ️ Cloudflare Notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "ℹ️ CLOUDFLARE_API_TOKEN not configured in GitHub Secrets. Skipping Cloudflare Pages deploy."

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy FileStream Server & Player to Oracle Cloud (OCI)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🎬 Deploy FileStream Server to OCI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Auto-Deploy to OCI via SSH
        env:
          TARGET_HOST: ${{ secrets.OCI_HOST }}
          TARGET_USER: ${{ secrets.OCI_USER || 'ubuntu' }}
          TARGET_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          if [ -n "$TARGET_SSH_KEY" ] && [ -n "$TARGET_HOST" ]; then
            echo "🔑 Connecting to Oracle Cloud (OCI) at $TARGET_HOST..."
            mkdir -p ~/.ssh
            printf "%s\n" "$TARGET_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

            echo "📤 Uploading updated stream_server.py to /home/$TARGET_USER/tg-filestream/..."
            scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 server/stream_server.py $TARGET_USER@$TARGET_HOST:/home/$TARGET_USER/tg-filestream/stream_server.py

            echo "🔄 Restarting tg-filestream.service on OCI..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 $TARGET_USER@$TARGET_HOST "sudo systemctl restart tg-filestream.service"

            sleep 2
            echo "🔍 Verifying service status..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 $TARGET_USER@$TARGET_HOST "sudo systemctl is-active --quiet tg-filestream.service && echo '🎉 tg-filestream.service is ACTIVE and running healthy on OCI!' || (echo '❌ Service failed to start' && exit 1)"
          else
            echo "ℹ️ OCI credentials not configured in GitHub Secrets (OCI_HOST, OCI_SSH_KEY). Skipping OCI deploy."
          fi
